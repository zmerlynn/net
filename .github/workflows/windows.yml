name: Windows IPv4 controls (fork only)

on:
  push:
    branches: [wormhole-windows-pktinfo]
  pull_request:
    branches: [wormhole-windows-pktinfo]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Vet IPv4, IPv6 and socket packages
        run: go vet ./ipv4/... ./ipv6/... ./internal/socket/...
      - name: Test IPv4, IPv6 and socket packages
        run: go test -v ./ipv4/... ./ipv6/... ./internal/socket/...
